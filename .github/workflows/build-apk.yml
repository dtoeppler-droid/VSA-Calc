name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: 1.0.${{ github.run_number }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Versionsnummer in die App schreiben
        run: sed -i "s/__VERSION__/${VERSION}/" www/index.html

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Android-Projekt erzeugen
        run: |
          npx cap add android
          npx cap sync android

      - name: App-Icons und Startbild erzeugen
        continue-on-error: true
        run: npx --yes @capacitor/assets@3 generate --android

      - name: Hochformat festlegen
        run: |
          sed -i 's|android:name="com.getcapacitor.myapp|android:screenOrientation="portrait" android:name="com.getcapacitor.myapp|' android/app/src/main/AndroidManifest.xml || true
          grep -q 'screenOrientation' android/app/src/main/AndroidManifest.xml || \
            sed -i 's|<activity|<activity android:screenOrientation="portrait"|' android/app/src/main/AndroidManifest.xml

      - name: Versionscode für Updates hochzählen
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${VERSION_CODE}/; s/versionName \"[^\"]*\"/versionName \"${VERSION}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../VSA-Calc.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VSA-Calc-APK
          path: VSA-Calc.apk

      - name: Release mit Download erstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: VSA Calc ${{ env.VERSION }}
          files: VSA-Calc.apk

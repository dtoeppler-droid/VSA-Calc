name: Build APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Android-Projekt erzeugen
        run: |
          npx cap add android
          npx cap sync android

      - name: Hochformat festlegen
        run: |
          sed -i 's|android:name="com.getcapacitor.myapp|android:screenOrientation="portrait" android:name="com.getcapacitor.myapp|' android/app/src/main/AndroidManifest.xml || true
          grep -q 'screenOrientation' android/app/src/main/AndroidManifest.xml || \
            sed -i 's|<activity|<activity android:screenOrientation="portrait"|' android/app/src/main/AndroidManifest.xml

      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/debug/app-debug.apk VSA-Calc.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VSA-Calc-APK
          path: VSA-Calc.apk

      - name: Release erstellen (nur bei Tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: VSA-Calc.apk
